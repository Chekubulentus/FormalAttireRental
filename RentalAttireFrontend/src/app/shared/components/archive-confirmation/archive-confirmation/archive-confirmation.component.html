<!--
  ArchiveConfirmationComponent
  ─────────────────────────────────────────────────────────────
  A compact confirmation modal shown before archiving a record.
  The parent is responsible for the API call and toastr notification.

  Usage:
    <div class="modal-overlay" *ngIf="showArchiveModal" (click)="closeArchiveModal()">
      <app-archive-confirmation
        [recordName]="selectedRecord.name"
        [recordType]="'Employee'"
        [isArchiving]="isArchiving"
        (cancelled)="closeArchiveModal()"
        (confirmed)="onArchiveConfirmed()">
      </app-archive-confirmation>
    </div>
-->

<div class="confirm-card" (click)="$event.stopPropagation()">

  <!-- ── Icon ─────────────────────────────────────────────── -->
  <div class="icon-wrap">
    <svg viewBox="0 0 32 32" fill="none">
      <rect x="4" y="7" width="24" height="5" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
      <path d="M6 12v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V12" stroke="currentColor" stroke-width="1.6"/>
      <line x1="12" y1="17" x2="20" y2="17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- ── Text ──────────────────────────────────────────────── -->
  <div class="confirm-text">
    <h2>Archive {{ recordType }}?</h2>
    <p>
      You are about to archive
      <strong>{{ recordName }}</strong>.
      This record will no longer appear in active lists but can be recovered later.
    </p>
  </div>

  <!-- ── Record Chip — shows what's being archived ────────── -->
  <div class="record-chip">
    <svg viewBox="0 0 16 16" fill="none">
      <rect x="2" y="3" width="12" height="3" rx="1" stroke="currentColor" stroke-width="1.3"/>
      <path d="M3 6v6a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V6" stroke="currentColor" stroke-width="1.3"/>
      <line x1="6" y1="9" x2="10" y2="9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
    <span class="chip-type">{{ recordType }}</span>
    <span class="chip-sep">·</span>
    <span class="chip-name">{{ recordName }}</span>
  </div>

  <!-- ── Footer ────────────────────────────────────────────── -->
  <div class="confirm-footer">

    <button class="btn-cancel" (click)="cancel()" [disabled]="isArchiving">
      Cancel
    </button>

    <button class="btn-archive" (click)="confirm()" [disabled]="isArchiving">
      <ng-container *ngIf="!isArchiving">
        <svg viewBox="0 0 16 16" fill="none">
          <rect x="2" y="3" width="12" height="3" rx="1" stroke="currentColor" stroke-width="1.3"/>
          <path d="M3 6v6a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V6" stroke="currentColor" stroke-width="1.3"/>
          <line x1="6" y1="9" x2="10" y2="9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        Yes, Archive
      </ng-container>
      <ng-container *ngIf="isArchiving">
        <span class="btn-spinner"></span>
        Archiving...
      </ng-container>
    </button>

  </div>

</div>
