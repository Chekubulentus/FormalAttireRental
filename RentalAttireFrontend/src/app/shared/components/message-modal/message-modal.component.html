<div class="modal-overlay" *ngIf="isOpen" (click)="onOverlayClick()">
  <div class="modal-card" [ngClass]="'variant-' + variant" (click)="$event.stopPropagation()">

    <div class="modal-icon" [ngClass]="'variant-' + variant">
      <svg *ngIf="variant === 'success'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20 6L9 17l-5-5" />
      </svg>
      <svg *ngIf="variant === 'error'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18 6L6 18M6 6l12 12" />
      </svg>
      <svg *ngIf="variant === 'warning'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86l-8.18 14.18A2 2 0 0 0 3.82 21h16.36a2 2 0 0 0 1.71-2.96L13.71 3.86a2 2 0 0 0-3.42 0z" />
      </svg>
      <svg *ngIf="variant === 'neutral'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 16v-4m0-4h.01" />
      </svg>
    </div>

    <h2 class="modal-title" *ngIf="title">{{ title }}</h2>
    <p class="modal-message">{{ message }}</p>

    <div class="modal-actions">
      <ng-container *ngIf="type === 'confirm'; else infoActions">
        <button class="btn-secondary" (click)="onCancel()">{{ cancelLabel }}</button>
        <button class="btn-primary" [ngClass]="'variant-' + variant" (click)="onConfirm()">{{ confirmLabel }}</button>
      </ng-container>
      <ng-template #infoActions>
        <button class="btn-primary" [ngClass]="'variant-' + variant" (click)="onConfirm()">{{ confirmLabel }}</button>
      </ng-template>
    </div>

  </div>
</div>
