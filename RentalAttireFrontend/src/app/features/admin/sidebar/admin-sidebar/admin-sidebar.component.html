<aside class="sidebar" [class.collapsed]="isCollapsed">

  <!-- Logo -->
  <div class="sidebar-logo">
    <div class="logo-mark">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 8 C20 8 20 13 20 13 L9 24 Q8 25 9 26 L31 26 Q32 25 31 24 Z"
              stroke="#a07840" stroke-width="1.4" fill="none" stroke-linejoin="round"/>
        <circle cx="20" cy="7" r="1.8" fill="#a07840"/>
        <line x1="20" y1="5.2" x2="20" y2="3" stroke="#a07840" stroke-width="1.4"/>
        <path d="M17.5 3 Q20 1.5 22.5 3" stroke="#a07840" stroke-width="1.4" fill="none"/>
      </svg>
    </div>
    <div class="logo-text" *ngIf="!isCollapsed">
      <span class="logo-name">ÉLÉGANCE</span>
      <span class="logo-sub">Admin Portal</span>
    </div>
    <button class="collapse-btn" (click)="toggleCollapse()" [title]="isCollapsed ? 'Expand' : 'Collapse'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" [class.rotated]="isCollapsed">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">

    <p class="nav-section" *ngIf="!isCollapsed">Overview</p>

    <a class="nav-item" routerLink="/admin/dashboard" routerLinkActive="active"
       [routerLinkActiveOptions]="{exact: true}" [title]="isCollapsed ? 'Dashboard' : ''">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
        </svg>
      </span>
      <span class="nav-label" *ngIf="!isCollapsed">Dashboard</span>
    </a>

    <a class="nav-item" routerLink="/admin/inventory" routerLinkActive="active" [title]="isCollapsed ? 'Inventory' : ''">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M20.38 3.46L16 2a4 4 0 01-8 0L3.62 3.46a2 2 0 00-1.34 2.23l.58 3.57a1 1 0 00.99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 002-2V10h2.15a1 1 0 00.99-.84l.58-3.57a2 2 0 00-1.34-2.23z"/>
        </svg>
      </span>
      <span class="nav-label" *ngIf="!isCollapsed">Inventory</span>
    </a>

    <a class="nav-item" routerLink="/admin/rentals" routerLinkActive="active" [title]="isCollapsed ? 'Rentals' : ''">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
      </span>
      <span class="nav-label" *ngIf="!isCollapsed">Rentals</span>
    </a>

    <a class="nav-item" routerLink="/admin/customers" routerLinkActive="active" [title]="isCollapsed ? 'Customers' : ''">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 00-3-3.87"/>
          <path d="M16 3.13a4 4 0 010 7.75"/>
        </svg>
      </span>
      <span class="nav-label" *ngIf="!isCollapsed">Customers</span>
    </a>

    <p class="nav-section" *ngIf="!isCollapsed">Management</p>

    <a class="nav-item" routerLink="/admin/reports" routerLinkActive="active" [title]="isCollapsed ? 'Reports' : ''">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
          <line x1="2" y1="20" x2="22" y2="20"/>
        </svg>
      </span>
      <span class="nav-label" *ngIf="!isCollapsed">Reports</span>
    </a>

    <a class="nav-item" routerLink="/admin/settings" routerLinkActive="active" [title]="isCollapsed ? 'Settings' : ''">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.07 4.93l-1.41 1.41M5.34 5.34L3.93 6.76M19.07 19.07l-1.41-1.41M5.34 18.66l-1.41 1.41M21 12h-2M5 12H3M12 21v-2M12 5V3"/>
        </svg>
      </span>
      <span class="nav-label" *ngIf="!isCollapsed">Settings</span>
    </a>

  </nav>

  <!-- Footer / User -->
  <div class="sidebar-footer">
    <div class="user-block">
      <div class="user-avatar">A</div>
      <div class="user-meta" *ngIf="!isCollapsed">
        <p class="user-name">{{currentUser.email}}</p>
        <p class="user-role">Administrator</p>
      </div>
    </div>
    <button class="logout-btn" (click)="logout()" title="Sign out" *ngIf="!isCollapsed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </div>

</aside>
