<div class="modal-card" (click)="$event.stopPropagation()">

  <!-- ── Header ─────────────────────────────────────────────── -->
  <div class="modal-header">
    <div class="modal-header__left">
      <div class="modal-icon">
        <svg viewBox="0 0 20 20" fill="none">
          <path d="M14.5 2.5l3 3L6 17H3v-3L14.5 2.5z"
                stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <h2 class="modal-title">Edit Category</h2>
        <p class="modal-subtitle">Update the code, name, or description.</p>
      </div>
    </div>
    <button class="btn-close" (click)="close()" title="Close">
      <svg viewBox="0 0 16 16" fill="none">
        <line x1="4" y1="4" x2="12" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="12" y1="4" x2="4"  y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- ── Category Badge ─────────────────────────────────────── -->
  <div class="category-badge">
    <span class="badge-code">{{ category.categoryCode }}</span>
    <span class="badge-name">{{ category.categoryName }}</span>
  </div>

  <!-- ── Body ───────────────────────────────────────────────── -->
  <div class="modal-body">

    <!-- Category Code -->
    <div class="field" [class.invalid]="hasError('categoryCode')">
      <label class="field__label">Category Code <span class="required">*</span></label>
      <input
        class="field__input"
        type="text"
        placeholder="e.g. CAT-001"
        [(ngModel)]="form.categoryCode"/>
      <span class="field__error" *ngIf="hasError('categoryCode')">
        {{ errorMsg('categoryCode') }}
      </span>
    </div>

    <!-- Category Name -->
    <div class="field" [class.invalid]="hasError('categoryName')">
      <label class="field__label">Category Name <span class="required">*</span></label>
      <input
        class="field__input"
        type="text"
        placeholder="e.g. Barong"
        [(ngModel)]="form.categoryName"/>
      <span class="field__error" *ngIf="hasError('categoryName')">
        {{ errorMsg('categoryName') }}
      </span>
    </div>

    <!-- Description -->
    <div class="field">
      <label class="field__label">Description <span class="optional">(optional)</span></label>
      <textarea
        class="field__input field__textarea"
        placeholder="Short description of this category..."
        rows="3"
        [(ngModel)]="form.description">
      </textarea>
    </div>

  </div>

  <!-- ── Footer ─────────────────────────────────────────────── -->
  <div class="modal-footer">
    <button class="btn-cancel" (click)="close()" [disabled]="isSaving">Cancel</button>
    <button class="btn-save" (click)="save()" [disabled]="isSaving">
      <span class="btn-spinner" *ngIf="isSaving"></span>
      <ng-container *ngIf="!isSaving">Save Changes</ng-container>
    </button>
  </div>

</div>
