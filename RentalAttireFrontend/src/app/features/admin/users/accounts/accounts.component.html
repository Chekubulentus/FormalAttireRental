<div class="accounts">

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-wrap">
      <svg viewBox="0 0 20 20" fill="none">
        <circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="1.3"/>
        <line x1="13.5" y1="13.5" x2="17" y2="17" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <input type="text" class="search-input" placeholder="Search accounts..." [(ngModel)]="searchQuery"/>
    </div>
    <div class="toolbar-right">
      <div class="filter-chip" [class.active]="filterActive === 'all'" (click)="filterActive = 'all'">All</div>
      <div class="filter-chip" [class.active]="filterActive === 'admin'" (click)="filterActive = 'admin'">Admin</div>
      <div class="filter-chip" [class.active]="filterActive === 'staff'" (click)="filterActive = 'staff'">Staff</div>
      <button class="btn-add">
        <svg viewBox="0 0 20 20" fill="none">
          <line x1="10" y1="4" x2="10" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="4" y1="10" x2="16" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Add Account
      </button>
    </div>
  </div>

  <!-- Cards Grid -->
  <div class="accounts-grid">
    <div class="account-card" *ngFor="let acc of accounts; let i = index" [style.animation-delay]="i * 0.06 + 's'">
      <div class="card-top">
        <div class="account-avatar" [style.background]="acc.avatarColor">{{ acc.name[0] }}</div>
        <span class="role-badge" [class]="acc.role.toLowerCase()">{{ acc.role }}</span>
      </div>
      <div class="card-body">
        <p class="acc-name">{{ acc.name }}</p>
        <p class="acc-email">{{ acc.email }}</p>
        <p class="acc-last-login">Last login: {{ acc.lastLogin }}</p>
      </div>
      <div class="card-footer">
        <span class="status-dot" [class]="acc.status.toLowerCase()"></span>
        <span class="status-text">{{ acc.status }}</span>
        <div class="card-actions">
          <button class="action-btn" title="Edit">
            <svg viewBox="0 0 20 20" fill="none">
              <path d="M14.5 2.5l3 3L6 17H3v-3L14.5 2.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="action-btn danger" title="Delete">
            <svg viewBox="0 0 20 20" fill="none">
              <polyline points="3 5 4.5 5 17 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              <path d="M16 5l-.9 11a2 2 0 01-2 1.9H6.9A2 2 0 014.9 16L4 5" stroke="currentColor" stroke-width="1.3"/>
              <path d="M8 9v5M12 9v5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              <path d="M8 5V3.5a.5.5 0 01.5-.5h3a.5.5 0 01.5.5V5" stroke="currentColor" stroke-width="1.3"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="table-footer">
    <p class="table-count">Showing {{ accounts.length }} accounts</p>
  </div>

</div>
