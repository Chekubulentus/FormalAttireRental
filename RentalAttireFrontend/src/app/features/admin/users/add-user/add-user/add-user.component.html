<div class="modal-card" (click)="$event.stopPropagation()">

  <!-- Header -->
  <div class="modal-header">
    <div>
      <span class="eyebrow">System · Users</span>
      <h2>Account Setup</h2>
    </div>
    <button class="close-btn" (click)="closeForm.emit()">
      <svg viewBox="0 0 20 20" fill="none">
        <line x1="4" y1="4" x2="16" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="16" y1="4" x2="4"  y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- Body -->
  <div class="modal-body">
    <div class="section-label"><span class="dot"></span>User Credentials</div>

    <div class="field">
      <label class="field-label">Email <span class="required">*</span></label>
      <input type="email" class="field-input" placeholder="e.g. admin@gmail.com" [(ngModel)]="email">
    </div>

    <div class="field">
      <label class="field-label">Password <span class="required">*</span></label>
      <input type="password" class="field-input" placeholder="••••••••" [(ngModel)]="password">
    </div>
  </div>

  <!-- Footer -->
  <div class="modal-footer">
    <button class="btn-cancel" (click)="closeForm.emit()">Back</button>
    <button class="btn-submit" (click)="createEmployee()">
      Create Account
      <svg viewBox="0 0 16 16" fill="none">
        <polyline points="4 8 12 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <polyline points="8 4 12 8 8 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

</div>
